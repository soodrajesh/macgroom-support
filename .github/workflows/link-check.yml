name: Link Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Catches links that rot on their own (no push here caused it) —
    # e.g. a GitHub repo it points to getting renamed, like the
    # homebrew-macgroom -> homebrew-tap rename this was added after.
    - cron: "0 6 * * 1"

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          check-modified-files-only: "no"
          folder-path: "."
